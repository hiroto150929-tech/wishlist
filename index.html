<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my list</title>
<!-- PWA(ホーム画面に追加したときアプリとして開く設定) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="my list">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  /* ===== デザイントークン(配色はここでまとめて変更できます) ===== */
  :root {
    --ink: #111111;         /* 黒(文字・メインボタン) */
    --ink-2: #333333;       /* ホバー */
    --bg: #ecebe8;          /* 画面の背景(ライトグレー) */
    --card: #ffffff;        /* カード */
    --surface: #dcdbd7;     /* 濃いめのグレー面 */
    --dark: #161616;        /* 黒い面(ヘッダー・合計) */
    --on-dark: #f4f4f2;     /* 黒い面の上の文字 */
    --on-dark-muted: #9b9b97;
    --text: #111111;
    --muted: #767676;       /* 補足文字 */
    --line: #e2e2e0;        /* 罫線 */
    --line-strong: #111111;
    --radius: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f2f2; --ink-2: #d6d6d6; --bg: #0c0c0c; --card: #161616; --surface: #232323;
      --dark: #000000; --on-dark: #f4f4f2; --on-dark-muted: #8a8a86;
      --text: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; --line-strong: #f2f2f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased; letter-spacing: .01em;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* ===== ヘッダー:白地+下に細い黒線 ===== */
  .topbar {
    background: var(--dark); color: var(--on-dark);
    padding: calc(16px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
    position: sticky; top: 0; z-index: 5;
  }
  .topbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; background: var(--dark); color: var(--on-dark); border: 1px solid var(--on-dark-muted);
    display: grid; place-items: center; font-weight: 600; font-size: 12px; letter-spacing: .02em; flex: none;
  }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .topbar .btn-line { color: var(--on-dark); border-color: #444; }
  .topbar .btn-line:hover { border-color: var(--on-dark); }
  .who { font-size: 11px; color: var(--on-dark-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .wrap {
    max-width: 720px; margin: 0 auto;
    padding: 0 calc(20px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }

  /* ===== ボタン ===== */
  .btn {
    background: var(--ink); color: var(--bg); border: 1px solid var(--ink); border-radius: var(--radius);
    padding: 14px 18px; cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  }
  .btn:hover { background: var(--ink-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-line {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius); padding: 6px 12px; font-size: 11px; cursor: pointer; font-weight: 600; letter-spacing: .08em;
  }
  .btn-line:hover { border-color: var(--line-strong); }
  .link { background: none; border: 0; color: var(--text); cursor: pointer; padding: 0 0 2px; font-size: 12px; border-bottom: 1px solid currentColor; letter-spacing: .04em; }

  /* ===== 入力欄:下線だけのミニマルな形 ===== */
  input, select, textarea {
    width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; outline: none; -webkit-appearance: none; appearance: none;
  }
  select {
    padding-right: 18px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size: 4px 4px; background-repeat: no-repeat;
  }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--line-strong); }
  textarea { resize: vertical; min-height: 64px; }
  label { display: block; font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 22px 0 2px; }
  .req { margin-left: 6px; color: var(--text); }

  .msg { font-size: 12px; margin-top: 14px; min-height: 18px; color: #b00020; }
  .msg.ok { color: var(--text); }

  /* ===== セクション見出し ===== */
  .sec-title { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 10px; }
  .sec-title h2 { margin: 0; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }

  /* ===== ログイン ===== */
  .auth-top { background: var(--dark); color: var(--on-dark); }
  .auth-top .eyebrow { color: var(--on-dark-muted); }
  .auth-top .brand-mark { background: var(--dark); color: var(--on-dark); border-color: var(--on-dark-muted); }
  .auth-hero { padding: calc(64px + env(safe-area-inset-top)) 24px 40px; max-width: 440px; margin: 0 auto; }
  .auth-panel { background: var(--card) !important; padding: 4px 22px 26px !important; margin-top: 20px !important; }
  .auth-hero .brand-mark { width: 56px; height: 56px; font-size: 18px; margin-bottom: 32px; }
  .auth-hero h1 { margin: 6px 0 0; font-size: 30px; font-weight: 300; letter-spacing: -.01em; line-height: 1.25; }
  .panel { background: transparent; padding: 0; }
  .auth-panel { max-width: 440px; margin: 0 auto; padding: 0 4px; }
  .auth-panel h2 { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 28px 0 0; }
  .auth-links { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

  /* ===== サマリー ===== */
  .summary-band { background: var(--dark); color: var(--on-dark); border-top: 1px solid #2c2c2c; }
  .summary-band .eyebrow { color: var(--on-dark-muted); }
  .summary-card { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding: 26px calc(20px + env(safe-area-inset-right)) 28px calc(20px + env(safe-area-inset-left)); }
  .summary-card .total { font-size: 44px; font-weight: 300; letter-spacing: -.02em; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .summary-card .count { font-size: 12px; color: var(--on-dark-muted); letter-spacing: .06em; text-align: right; }
  .summary-card .count b { color: var(--on-dark); font-size: 20px; font-weight: 400; display: block; }

  /* ===== タブ ===== */
  .tabs { display: flex; margin-top: 20px; background: var(--surface); padding: 3px; }
  .tab {
    flex: 1; background: none; border: 0; padding: 9px 0; cursor: pointer; font-size: 12px; font-weight: 600;
    letter-spacing: .12em; color: var(--muted);
  }
  .tab.active { background: var(--dark); color: var(--on-dark); }

  .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 16px; margin-top: 6px; }
  .toolbar .search { grid-column: 1 / -1; }
  .toolbar select { font-size: 12px; color: var(--muted); }

  /* ===== 一覧 ===== */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; gap: 14px; padding: 18px 18px 16px; background: var(--card); align-items: flex-start; border-left: 3px solid var(--card); }
  .item.pr1 { border-left-color: var(--dark); }
  .item.done { background: transparent; border: 1px dashed var(--surface); }
  .item.done .name, .item.done .price { color: var(--muted); text-decoration: line-through; }
  .check {
    width: 18px; height: 18px; margin-top: 4px; flex: none; cursor: pointer; padding: 0;
    border: 1px solid var(--line-strong); background: transparent; display: grid; place-items: center;
  }
  .check:checked { background: var(--ink); }
  .check:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .body { flex: 1; min-width: 0; }
  .row1 { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .name { font-weight: 500; font-size: 15px; word-break: break-word; }
  a.name { color: var(--text); text-decoration: none; }
  a.name::after { content: "↗"; font-size: 12px; margin-left: 6px; color: var(--muted); }
  a.name:hover { text-decoration: underline; text-underline-offset: 3px; }
  .price { font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; align-items: center; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 6px; height: 6px; border: 1px solid var(--line-strong); }
  .badge.p1 { color: var(--text); }
  .badge.p1::before { background: var(--ink); }
  .badge.p2::before { background: var(--muted); border-color: var(--muted); }
  .badge.p3::before { border-color: var(--muted); }
  .cat::before { content: "/ "; margin-right: 2px; }
  .memo { margin-top: 8px; font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .item-foot { display: flex; justify-content: flex-end; align-items: center; margin-top: 10px; gap: 8px; }

  .actions { display: flex; gap: 16px; margin-left: auto; }
  .actions button { background: none; border: 0; padding: 0; font-size: 11px; color: var(--muted); letter-spacing: .1em; cursor: pointer; }
  .actions button:hover { color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 56px 16px; font-size: 13px; }

  /* ===== 下部の追加ボタン ===== */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--dark);
    padding: 12px calc(20px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .bottom-bar .btn { background: var(--on-dark); color: var(--dark); border-color: var(--on-dark); display: block; width: 100%; max-width: 720px; margin: 0 auto; }

  /* ===== 追加・編集ダイアログ ===== */
  dialog {
    border: 0; padding: 0; width: 100%; max-width: 560px; background: var(--card); color: var(--text);
    margin: auto auto 0; max-height: 92vh;
  }
  @media (min-width: 600px) { dialog { margin: auto; } }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg-head { padding: 20px 24px 16px; background: var(--dark); color: var(--on-dark); display: flex; justify-content: space-between; align-items: center; }
  .dlg-head h2 { margin: 0; font-size: 22px; font-weight: 300; }
  .dlg-close { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--on-dark); font-weight: 200; }
  dialog form { padding: 0 24px calc(22px + env(safe-area-inset-bottom)); }
  .row { display: flex; gap: 20px; }
  .row > div { flex: 1; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 30px; }
  .dlg-actions .btn { flex: 2; }
  .dlg-actions .btn-line { flex: 1; font-size: 12px; padding: 14px; text-transform: uppercase; letter-spacing: .14em; }

/* ===== テーマ: パターンA(白ベース+薄いグレー) ===== */
:root{--bg:#ffffff;--card:#ffffff;--surface:#f1f1ef;--dark:#111;--on-dark:#fff;--on-dark-muted:#999;--line:#e4e4e1}

.topbar{background:#fff;color:#111;border-bottom:1px solid #111}

.topbar .brand-mark{background:#111;color:#fff;border:0}

.topbar .who{color:#888}
.topbar .btn-line{color:#111;border-color:#ddd}

.summary-band{background:#f1f1ef;color:#111;border:0}

.summary-band .eyebrow,.summary-card .count{color:#777}
.summary-card .count b{color:#111}

.summary-card .total{font-size:48px}

.tabs{background:transparent;padding:0;gap:24px;border-bottom:1px solid #e4e4e1}

.tab{flex:none;padding:0 0 10px;border-bottom:2px solid transparent;margin-bottom:-1px}

.tab.active{background:none;color:#111;border-bottom-color:#111}

.list{gap:0;border-top:1px solid #111}

.item{border:0;border-bottom:1px solid #e4e4e1;padding:18px 0;background:#fff}

.item.pr1{border-left:0}

.item.pr1 .name{font-weight:700}

.bottom-bar{background:#fff;border-top:1px solid #e4e4e1}

.bottom-bar .btn{background:#111;color:#fff}


/* ログイン・編集画面もパターンAに合わせる */
.auth-top{background:#fff;color:#111;border-bottom:1px solid #111}
.auth-top .eyebrow{color:#888}
.auth-top .brand-mark{background:#111;color:#fff;border:0}
body:has(#auth:not([hidden])){background:#f1f1ef}
.dlg-head{background:#fff;color:#111;border-bottom:1px solid #111}
.dlg-close{color:#111}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e0e0e;--card:#0e0e0e;--surface:#1c1c1c;--line:#2a2a2a;--text:#f2f2f0;--muted:#8d8d89;--ink:#f2f2f0;--line-strong:#f2f2f0}
  .topbar,.auth-top,.dlg-head,.item,.bottom-bar{background:#0e0e0e;color:#f2f2f0;border-color:#2a2a2a}
  .topbar{border-bottom-color:#f2f2f0}
  .topbar .brand-mark,.auth-top .brand-mark{background:#f2f2f0;color:#0e0e0e}
  .topbar .btn-line{color:#f2f2f0;border-color:#333}
  .summary-band{background:#1c1c1c;color:#f2f2f0}.summary-card .count b{color:#f2f2f0}
  .tab.active{color:#f2f2f0;border-bottom-color:#f2f2f0}
  .list{border-top-color:#f2f2f0}
  .bottom-bar .btn{background:#f2f2f0;color:#0e0e0e}
  .dlg-close{color:#f2f2f0}
  body:has(#auth:not([hidden])){background:#1c1c1c}
}
</style>
</head>
<body>

<!-- 設定が未入力のときの案内 -->
<div id="setup" class="wrap" hidden>
  <div class="panel">
    <h2>設定が必要です</h2>
    <p><code>config.js</code> の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、Supabase プロジェクトの値に書き換えてください。</p>
  </div>
</div>

<!-- ログイン画面 -->
<div id="auth" hidden>
  <div class="auth-top"><div class="auth-hero">
    <div class="brand-mark">list</div>
    <div class="eyebrow">my list</div>
    <h1>欲しいものを、<br>ひとつの場所に。</h1>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div class="panel auth-panel">
      <h2 id="authTitle">ログイン</h2>
      <p id="authLead" hidden></p>
      <form id="authForm">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">パスワード(6文字以上)</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <div style="margin-top:20px">
          <button id="authSubmit" class="btn" style="width:100%">ログイン</button>
        </div>
      </form>
      <div id="authMsg" class="msg"></div>
      <div class="auth-links">
        <button id="toggleMode" class="link" type="button">はじめての方はこちら(新規登録)</button>
        <button id="resetPw" class="link" type="button">パスワードをお忘れの方</button>
      </div>
    </div>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">list</div>
        <div style="min-width:0">
          <h1>my list</h1>
        </div>
      </div>
      <button id="logout" class="btn-line">ログアウト</button>
    </div>
  </div>

  <div class="summary-band">
    <div class="summary-card">
      <div>
        <div class="eyebrow">Total ・ 表示中の合計</div>
        <div class="total" id="total">¥0</div>
      </div>
      <div class="count"><b id="count">0</b>ITEMS</div>
    </div>
  </div>

  <div class="wrap">

    <div class="tabs" role="tablist">
      <button class="tab active" data-status="open" type="button">未購入</button>
      <button class="tab" data-status="all" type="button">すべて</button>
      <button class="tab" data-status="done" type="button">購入済み</button>
    </div>
    <input type="hidden" id="fStatus" value="open">

    <div class="toolbar">
      <input id="q" class="search" type="search" placeholder="名前・メモで検索">
      <select id="fCategory"><option value="">カテゴリ</option></select>
      <select id="fPriority">
        <option value="">優先度</option>
        <option value="1">高</option>
        <option value="2">中</option>
        <option value="3">低</option>
      </select>
      <select id="sort">
        <option value="priority">優先度順</option>
        <option value="new">新しい順</option>
        <option value="priceAsc">安い順</option>
        <option value="priceDesc">高い順</option>
      </select>
    </div>

    <div class="sec-title"><h2>Items</h2></div>
    <div id="list" class="list"></div>
  </div>

  <div class="bottom-bar">
    <button id="add" class="btn">＋ Add item</button>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlgTitle">追加</h2>
    <button type="button" class="dlg-close" id="dlgX" aria-label="閉じる">×</button>
  </div>
  <form method="dialog" id="form">
    <label for="fName">名前<span class="req">*</span></label>
    <input id="fName" required maxlength="200">
    <div class="row">
      <div>
        <label for="fPrice">価格(円)</label>
        <input id="fPrice" type="number" min="0" inputmode="numeric">
      </div>
      <div>
        <label for="fPrio">優先度</label>
        <select id="fPrio">
          <option value="1">高</option>
          <option value="2" selected>中</option>
          <option value="3">低</option>
        </select>
      </div>
    </div>
    <label for="fCat">カテゴリ</label>
    <input id="fCat" list="catList" maxlength="50" placeholder="例: ガジェット、本、服">
    <datalist id="catList"></datalist>
    <label for="fUrl">商品ページのURL</label>
    <input id="fUrl" type="url" placeholder="https://">
    <label for="fMemo">メモ</label>
    <textarea id="fMemo"></textarea>
    <div id="dlgMsg" class="msg"></div>
    <div class="dlg-actions">
      <button type="button" class="btn-line" id="cancel">キャンセル</button>
      <button class="btn" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
// 接続設定は config.js に分けてあります(index.html を差し替えても設定が消えないように)
const { SUPABASE_URL = "", SUPABASE_ANON_KEY = "" } = window.WISHLIST_CONFIG || {};

const $ = (id) => document.getElementById(id);
const PRIO_LABEL = { 1: "高", 2: "中", 3: "低" };
const yen = (n) => "¥" + Number(n || 0).toLocaleString("ja-JP");

let sb, session = null, wishes = [], editingId = null, signUpMode = false;

function show(view) {
  for (const id of ["setup", "auth", "app"]) $(id).hidden = id !== view;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function safeUrl(u) {
  try {
    const x = new URL(u);
    return x.protocol === "http:" || x.protocol === "https:" ? x.href : null;
  } catch { return null; }
}

// ---------- 認証 ----------
function setAuthMode(signUp) {
  signUpMode = signUp;
  $("authSubmit").textContent = signUp ? "新規登録" : "ログイン";
  $("authTitle").textContent = signUp ? "新規登録" : "ログイン";
  $("toggleMode").textContent = signUp ? "アカウントをお持ちの方はこちら(ログイン)" : "はじめての方はこちら(新規登録)";
  $("password").autocomplete = signUp ? "new-password" : "current-password";
  $("authMsg").textContent = "";
}

function authMsg(text, ok = false) {
  const el = $("authMsg");
  el.textContent = text;
  el.className = "msg" + (ok ? " ok" : "");
}

$("toggleMode").onclick = () => setAuthMode(!signUpMode);

$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  $("authSubmit").disabled = true;
  authMsg("");
  try {
    if (signUpMode) {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: location.href.split("#")[0] },
      });
      if (error) throw error;
      if (!data.session) authMsg("確認メールを送信しました。メール内のリンクを開いてからログインしてください。", true);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    authMsg(translateAuthError(err));
  } finally {
    $("authSubmit").disabled = false;
  }
};

$("resetPw").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return authMsg("メールアドレスを入力してから押してください。");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  if (error) return authMsg(translateAuthError(error));
  authMsg("パスワード再設定用のメールを送信しました。", true);
};

function translateAuthError(err) {
  const m = (err && err.message) || "";
  if (/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが違います。";
  if (/Email not confirmed/i.test(m)) return "メールの確認が済んでいません。届いたメールのリンクを開いてください。";
  if (/already registered/i.test(m)) return "このメールアドレスは登録済みです。ログインしてください。";
  if (/Password should be/i.test(m)) return "パスワードは6文字以上にしてください。";
  if (/rate limit/i.test(m)) return "短時間に操作が多すぎます。しばらくしてからお試しください。";
  return m || "エラーが発生しました。";
}

$("logout").onclick = () => sb.auth.signOut();

// ---------- データ ----------
async function loadWishes() {
  const { data, error } = await sb.from("wishes").select("*").order("created_at", { ascending: false });
  if (error) { alert("読み込みに失敗しました: " + error.message); return; }
  wishes = data;
  refreshCategoryOptions();
  render();
}

function refreshCategoryOptions() {
  const cats = [...new Set(wishes.map((w) => w.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja"));
  const cur = $("fCategory").value;
  $("fCategory").innerHTML = '<option value="">カテゴリ</option>' +
    cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  $("fCategory").value = cats.includes(cur) ? cur : "";
  $("catList").innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">`).join("");
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const cat = $("fCategory").value;
  const pr = $("fPriority").value;
  const st = $("fStatus").value;
  let list = wishes.filter((w) => {
    if (st === "open" && w.purchased) return false;
    if (st === "done" && !w.purchased) return false;
    if (cat && w.category !== cat) return false;
    if (pr && String(w.priority) !== pr) return false;
    if (q && !((w.name || "").toLowerCase().includes(q) || (w.memo || "").toLowerCase().includes(q))) return false;
    return true;
  });
  const s = $("sort").value;
  const byNew = (a, b) => new Date(b.created_at) - new Date(a.created_at);
  list.sort((a, b) => {
    if (s === "priority") return a.priority - b.priority || byNew(a, b);
    if (s === "priceAsc") return (a.price ?? Infinity) - (b.price ?? Infinity) || byNew(a, b);
    if (s === "priceDesc") return (b.price ?? -1) - (a.price ?? -1) || byNew(a, b);
    return byNew(a, b);
  });
  return list;
}

function render() {
  const list = filtered();
  const total = list.reduce((sum, w) => sum + (w.price || 0), 0);
  $("count").textContent = list.length;
  $("total").textContent = yen(total);

  if (!list.length) {
    $("list").innerHTML = `<div class="empty">${wishes.length ? "条件に合うものがありません" : "右下の + から追加してみましょう"}</div>`;
    return;
  }

  $("list").innerHTML = list.map((w) => {
    const url = w.url ? safeUrl(w.url) : null;
    return `
    <div class="item pr${w.priority}${w.purchased ? " done" : ""}" data-id="${w.id}">
      <input type="checkbox" class="check" ${w.purchased ? "checked" : ""} title="購入済み">
      <div class="body">
        <div class="row1">
          ${url
            ? `<a class="name" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(w.name)}</a>`
            : `<div class="name">${escapeHtml(w.name)}</div>`}
          ${w.price != null ? `<div class="price">${yen(w.price)}</div>` : ""}
        </div>
        <div class="meta">
          <span class="badge p${w.priority}">${["","High","Mid","Low"][w.priority]}</span>
          ${w.category ? `<span class="cat">${escapeHtml(w.category)}</span>` : ""}
        </div>
        <div class="item-foot">
          <div class="actions">
            <button class="edit">編集</button>
            <button class="del">削除</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

$("list").addEventListener("click", async (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  const id = item.dataset.id;
  const w = wishes.find((x) => x.id === id);
  if (!w) return;

  if (e.target.classList.contains("check")) {
    const purchased = e.target.checked;
    const { error } = await sb.from("wishes").update({ purchased }).eq("id", id);
    if (error) { alert("更新に失敗しました: " + error.message); e.target.checked = !purchased; return; }
    w.purchased = purchased;
    render();
  } else if (e.target.classList.contains("edit")) {
    openDialog(w);
  } else if (e.target.classList.contains("del")) {
    if (!confirm(`「${w.name}」を削除しますか?`)) return;
    const { error } = await sb.from("wishes").delete().eq("id", id);
    if (error) return alert("削除に失敗しました: " + error.message);
    wishes = wishes.filter((x) => x.id !== id);
    refreshCategoryOptions();
    render();
  }
});

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  $("fStatus").value = t.dataset.status;
  render();
}));
$("dlgX").onclick = () => $("dlg").close();

for (const id of ["q", "fCategory", "fPriority", "sort"]) {
  $(id).addEventListener("input", render);
}

// ---------- 追加・編集ダイアログ ----------
function openDialog(w = null) {
  editingId = w ? w.id : null;
  $("dlgTitle").textContent = w ? "編集" : "追加";
  $("fName").value = w?.name ?? "";
  $("fPrice").value = w?.price ?? "";
  $("fPrio").value = String(w?.priority ?? 2);
  $("fCat").value = w?.category ?? "";
  $("fUrl").value = w?.url ?? "";
  $("fMemo").value = w?.memo ?? "";
  $("dlgMsg").textContent = "";
  $("dlg").showModal();
  $("fName").focus();
}

$("add").onclick = () => openDialog();
$("cancel").onclick = () => $("dlg").close();

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const priceRaw = $("fPrice").value;
  const urlRaw = $("fUrl").value.trim();
  if (urlRaw && !safeUrl(urlRaw)) { $("dlgMsg").textContent = "URLは http:// または https:// で始まる形式で入力してください。"; return; }
  const payload = {
    name: $("fName").value.trim(),
    price: priceRaw === "" ? null : Math.max(0, parseInt(priceRaw, 10)),
    priority: parseInt($("fPrio").value, 10),
    category: $("fCat").value.trim() || null,
    url: urlRaw || null,
    memo: $("fMemo").value.trim() || null,
  };
  if (!payload.name) return;
  $("save").disabled = true;
  try {
    if (editingId) {
      const { data, error } = await sb.from("wishes").update(payload).eq("id", editingId).select().single();
      if (error) throw error;
      wishes = wishes.map((x) => (x.id === editingId ? data : x));
    } else {
      const { data, error } = await sb.from("wishes").insert(payload).select().single();
      if (error) throw error;
      wishes.unshift(data);
    }
    $("dlg").close();
    refreshCategoryOptions();
    render();
  } catch (err) {
    $("dlgMsg").textContent = "保存に失敗しました: " + err.message;
  } finally {
    $("save").disabled = false;
  }
};

// ---------- 起動 ----------
async function enter(sess) {
  session = sess;
  if (!sess) { wishes = []; show("auth"); return; }
  show("app");
  await loadWishes();
}

function init() {
  if (!SUPABASE_URL || SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")) {
    show("setup");
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  setAuthMode(false);
  sb.auth.onAuthStateChange((event, sess) => {
    // コールバック内で直接 await せず、次のタスクで処理する
    setTimeout(() => enter(sess), 0);
  });
}

init();

// PWA: Service Worker を登録(https か localhost のときだけ動く)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW登録失敗", err));
  });
}
</script>
