<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欲しいものリスト</title>
<!-- PWA(ホーム画面に追加したときアプリとして開く設定) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2553a">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="欲しいもの">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2723; --muted: #8a8279;
    --line: #e8e3dc; --accent: #c2553a; --accent-soft: #f6e4de;
    --p1: #c2553a; --p2: #d9a23b; --p3: #7a9a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18; --card: #26231f; --text: #f1ece6; --muted: #9a9288;
      --line: #3a362f; --accent: #e07a5f; --accent-soft: #3a2a25;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 720px; margin: 0 auto;
    /* iPhoneのノッチ・ホームバーに重ならないよう余白を確保 */
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(80px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  h1 { font-size: 22px; margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
  .who { font-size: 12px; color: var(--muted); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; cursor: pointer; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 6px 12px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card);
  }
  textarea { resize: vertical; min-height: 60px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .auth { max-width: 380px; margin: 60px auto; }
  .auth h1 { margin-bottom: 6px; }
  .auth p { color: var(--muted); font-size: 14px; margin-top: 0; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 18px; color: var(--accent); }
  .msg.ok { color: var(--p3); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar > * { flex: 1 1 120px; width: auto; }
  .toolbar .grow { flex: 2 1 180px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 12px; color: var(--muted); font-size: 13px; }
  .summary strong { color: var(--text); font-size: 18px; }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 14px 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
    border-left: 5px solid var(--p2);
  }
  .item.p1 { border-left-color: var(--p1); }
  .item.p3 { border-left-color: var(--p3); }
  .item.done { opacity: .55; }
  .item.done .name { text-decoration: line-through; }
  .check { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 13px; color: var(--muted); align-items: center; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .price { color: var(--text); font-weight: 600; }
  .memo { margin-top: 6px; font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .item a { color: var(--accent); text-decoration: none; }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .icon { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 4px 6px; font-size: 13px; border-radius: 8px; }
  .icon:hover { background: var(--accent-soft); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 50px 0; }

  .fab {
    position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%;
    font-size: 28px; line-height: 1; border: 0; background: var(--accent); color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer;
  }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(480px, 92vw); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 20px; }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- 設定が未入力のときの案内 -->
<div id="setup" class="wrap" hidden>
  <div class="panel">
    <h1>設定が必要です</h1>
    <p><code>config.js</code> の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、Supabase プロジェクトの値に書き換えてください。手順は README.md を参照してください。</p>
  </div>
</div>

<!-- ログイン画面 -->
<div id="auth" class="wrap" hidden>
  <div class="panel auth">
    <h1>🎁 欲しいものリスト</h1>
    <p id="authLead">メールアドレスとパスワードでログインします。</p>
    <form id="authForm">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">パスワード(6文字以上)</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <div style="margin-top:16px">
        <button id="authSubmit" class="btn" style="width:100%">ログイン</button>
      </div>
    </form>
    <div id="authMsg" class="msg"></div>
    <div style="display:flex; justify-content:space-between; margin-top:6px">
      <button id="toggleMode" class="link" type="button">はじめての方はこちら(新規登録)</button>
      <button id="resetPw" class="link" type="button">パスワードを忘れた</button>
    </div>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" class="wrap" hidden>
  <header>
    <div>
      <h1>🎁 欲しいものリスト</h1>
      <div class="who" id="who"></div>
    </div>
    <button id="logout" class="btn ghost">ログアウト</button>
  </header>

  <div class="toolbar">
    <input id="q" class="grow" type="search" placeholder="名前・メモで検索">
    <select id="fCategory"><option value="">すべてのカテゴリ</option></select>
    <select id="fPriority">
      <option value="">すべての優先度</option>
      <option value="1">高</option>
      <option value="2">中</option>
      <option value="3">低</option>
    </select>
    <select id="sort">
      <option value="priority">優先度順</option>
      <option value="new">新しい順</option>
      <option value="priceAsc">価格が安い順</option>
      <option value="priceDesc">価格が高い順</option>
    </select>
  </div>

  <div class="toolbar" style="margin-top:-4px">
    <select id="fStatus">
      <option value="open">未購入のみ</option>
      <option value="all">すべて</option>
      <option value="done">購入済みのみ</option>
    </select>
  </div>

  <div class="summary">
    <span id="count"></span>
    <span>表示中の合計 <strong id="total">¥0</strong></span>
  </div>

  <div id="list"></div>
  <button id="add" class="fab" aria-label="追加">+</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">追加</h2>
    <label for="fName">名前 *</label>
    <input id="fName" required maxlength="200">
    <div class="row">
      <div>
        <label for="fPrice">価格(円)</label>
        <input id="fPrice" type="number" min="0" inputmode="numeric">
      </div>
      <div>
        <label for="fPrio">優先度</label>
        <select id="fPrio">
          <option value="1">高</option>
          <option value="2" selected>中</option>
          <option value="3">低</option>
        </select>
      </div>
    </div>
    <label for="fCat">カテゴリ</label>
    <input id="fCat" list="catList" maxlength="50" placeholder="例: ガジェット、本、服">
    <datalist id="catList"></datalist>
    <label for="fUrl">URL</label>
    <input id="fUrl" type="url" placeholder="https://">
    <label for="fMemo">メモ</label>
    <textarea id="fMemo"></textarea>
    <div id="dlgMsg" class="msg"></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="cancel">キャンセル</button>
      <button class="btn" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
// 接続設定は config.js に分けてあります(index.html を差し替えても設定が消えないように)
const { SUPABASE_URL = "", SUPABASE_ANON_KEY = "" } = window.WISHLIST_CONFIG || {};

const $ = (id) => document.getElementById(id);
const PRIO_LABEL = { 1: "高", 2: "中", 3: "低" };
const yen = (n) => "¥" + Number(n || 0).toLocaleString("ja-JP");

let sb, session = null, wishes = [], editingId = null, signUpMode = false;

function show(view) {
  for (const id of ["setup", "auth", "app"]) $(id).hidden = id !== view;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function safeUrl(u) {
  try {
    const x = new URL(u);
    return x.protocol === "http:" || x.protocol === "https:" ? x.href : null;
  } catch { return null; }
}

// ---------- 認証 ----------
function setAuthMode(signUp) {
  signUpMode = signUp;
  $("authSubmit").textContent = signUp ? "新規登録" : "ログイン";
  $("toggleMode").textContent = signUp ? "アカウントをお持ちの方はこちら(ログイン)" : "はじめての方はこちら(新規登録)";
  $("password").autocomplete = signUp ? "new-password" : "current-password";
  $("authMsg").textContent = "";
}

function authMsg(text, ok = false) {
  const el = $("authMsg");
  el.textContent = text;
  el.className = "msg" + (ok ? " ok" : "");
}

$("toggleMode").onclick = () => setAuthMode(!signUpMode);

$("authForm").onsubmit = async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  $("authSubmit").disabled = true;
  authMsg("");
  try {
    if (signUpMode) {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { emailRedirectTo: location.href.split("#")[0] },
      });
      if (error) throw error;
      if (!data.session) authMsg("確認メールを送信しました。メール内のリンクを開いてからログインしてください。", true);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    authMsg(translateAuthError(err));
  } finally {
    $("authSubmit").disabled = false;
  }
};

$("resetPw").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return authMsg("メールアドレスを入力してから押してください。");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  if (error) return authMsg(translateAuthError(error));
  authMsg("パスワード再設定用のメールを送信しました。", true);
};

function translateAuthError(err) {
  const m = (err && err.message) || "";
  if (/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが違います。";
  if (/Email not confirmed/i.test(m)) return "メールの確認が済んでいません。届いたメールのリンクを開いてください。";
  if (/already registered/i.test(m)) return "このメールアドレスは登録済みです。ログインしてください。";
  if (/Password should be/i.test(m)) return "パスワードは6文字以上にしてください。";
  if (/rate limit/i.test(m)) return "短時間に操作が多すぎます。しばらくしてからお試しください。";
  return m || "エラーが発生しました。";
}

$("logout").onclick = () => sb.auth.signOut();

// ---------- データ ----------
async function loadWishes() {
  const { data, error } = await sb.from("wishes").select("*").order("created_at", { ascending: false });
  if (error) { alert("読み込みに失敗しました: " + error.message); return; }
  wishes = data;
  refreshCategoryOptions();
  render();
}

function refreshCategoryOptions() {
  const cats = [...new Set(wishes.map((w) => w.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja"));
  const cur = $("fCategory").value;
  $("fCategory").innerHTML = '<option value="">すべてのカテゴリ</option>' +
    cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  $("fCategory").value = cats.includes(cur) ? cur : "";
  $("catList").innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">`).join("");
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const cat = $("fCategory").value;
  const pr = $("fPriority").value;
  const st = $("fStatus").value;
  let list = wishes.filter((w) => {
    if (st === "open" && w.purchased) return false;
    if (st === "done" && !w.purchased) return false;
    if (cat && w.category !== cat) return false;
    if (pr && String(w.priority) !== pr) return false;
    if (q && !((w.name || "").toLowerCase().includes(q) || (w.memo || "").toLowerCase().includes(q))) return false;
    return true;
  });
  const s = $("sort").value;
  const byNew = (a, b) => new Date(b.created_at) - new Date(a.created_at);
  list.sort((a, b) => {
    if (s === "priority") return a.priority - b.priority || byNew(a, b);
    if (s === "priceAsc") return (a.price ?? Infinity) - (b.price ?? Infinity) || byNew(a, b);
    if (s === "priceDesc") return (b.price ?? -1) - (a.price ?? -1) || byNew(a, b);
    return byNew(a, b);
  });
  return list;
}

function render() {
  const list = filtered();
  const total = list.reduce((sum, w) => sum + (w.price || 0), 0);
  $("count").textContent = `${list.length} 件`;
  $("total").textContent = yen(total);

  if (!list.length) {
    $("list").innerHTML = `<div class="empty">${wishes.length ? "条件に合うものがありません" : "右下の + から追加してみましょう"}</div>`;
    return;
  }

  $("list").innerHTML = list.map((w) => {
    const url = w.url ? safeUrl(w.url) : null;
    return `
    <div class="item p${w.priority}${w.purchased ? " done" : ""}" data-id="${w.id}">
      <input type="checkbox" class="check" ${w.purchased ? "checked" : ""} title="購入済み">
      <div class="body">
        <div class="name">${escapeHtml(w.name)}</div>
        <div class="meta">
          ${w.price != null ? `<span class="price">${yen(w.price)}</span>` : ""}
          <span>優先度: ${PRIO_LABEL[w.priority]}</span>
          ${w.category ? `<span class="tag">${escapeHtml(w.category)}</span>` : ""}
          ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">リンクを開く ↗</a>` : ""}
        </div>
        ${w.memo ? `<div class="memo">${escapeHtml(w.memo)}</div>` : ""}
      </div>
      <div class="actions">
        <button class="icon edit">編集</button>
        <button class="icon del">削除</button>
      </div>
    </div>`;
  }).join("");
}

$("list").addEventListener("click", async (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  const id = item.dataset.id;
  const w = wishes.find((x) => x.id === id);
  if (!w) return;

  if (e.target.classList.contains("check")) {
    const purchased = e.target.checked;
    const { error } = await sb.from("wishes").update({ purchased }).eq("id", id);
    if (error) { alert("更新に失敗しました: " + error.message); e.target.checked = !purchased; return; }
    w.purchased = purchased;
    render();
  } else if (e.target.classList.contains("edit")) {
    openDialog(w);
  } else if (e.target.classList.contains("del")) {
    if (!confirm(`「${w.name}」を削除しますか?`)) return;
    const { error } = await sb.from("wishes").delete().eq("id", id);
    if (error) return alert("削除に失敗しました: " + error.message);
    wishes = wishes.filter((x) => x.id !== id);
    refreshCategoryOptions();
    render();
  }
});

for (const id of ["q", "fCategory", "fPriority", "fStatus", "sort"]) {
  $(id).addEventListener("input", render);
}

// ---------- 追加・編集ダイアログ ----------
function openDialog(w = null) {
  editingId = w ? w.id : null;
  $("dlgTitle").textContent = w ? "編集" : "追加";
  $("fName").value = w?.name ?? "";
  $("fPrice").value = w?.price ?? "";
  $("fPrio").value = String(w?.priority ?? 2);
  $("fCat").value = w?.category ?? "";
  $("fUrl").value = w?.url ?? "";
  $("fMemo").value = w?.memo ?? "";
  $("dlgMsg").textContent = "";
  $("dlg").showModal();
  $("fName").focus();
}

$("add").onclick = () => openDialog();
$("cancel").onclick = () => $("dlg").close();

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const priceRaw = $("fPrice").value;
  const urlRaw = $("fUrl").value.trim();
  if (urlRaw && !safeUrl(urlRaw)) { $("dlgMsg").textContent = "URLは http:// または https:// で始まる形式で入力してください。"; return; }
  const payload = {
    name: $("fName").value.trim(),
    price: priceRaw === "" ? null : Math.max(0, parseInt(priceRaw, 10)),
    priority: parseInt($("fPrio").value, 10),
    category: $("fCat").value.trim() || null,
    url: urlRaw || null,
    memo: $("fMemo").value.trim() || null,
  };
  if (!payload.name) return;
  $("save").disabled = true;
  try {
    if (editingId) {
      const { data, error } = await sb.from("wishes").update(payload).eq("id", editingId).select().single();
      if (error) throw error;
      wishes = wishes.map((x) => (x.id === editingId ? data : x));
    } else {
      const { data, error } = await sb.from("wishes").insert(payload).select().single();
      if (error) throw error;
      wishes.unshift(data);
    }
    $("dlg").close();
    refreshCategoryOptions();
    render();
  } catch (err) {
    $("dlgMsg").textContent = "保存に失敗しました: " + err.message;
  } finally {
    $("save").disabled = false;
  }
};

// ---------- 起動 ----------
async function enter(sess) {
  session = sess;
  if (!sess) { wishes = []; show("auth"); return; }
  $("who").textContent = sess.user.email;
  show("app");
  await loadWishes();
}

function init() {
  if (!SUPABASE_URL || SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")) {
    show("setup");
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  setAuthMode(false);
  sb.auth.onAuthStateChange((event, sess) => {
    // コールバック内で直接 await せず、次のタスクで処理する
    setTimeout(() => enter(sess), 0);
  });
}

init();

// PWA: Service Worker を登録(https か localhost のときだけ動く)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW登録失敗", err));
  });
}
</script>
</body>
</html>
